		<!-- Prevent theme flash -->
		<script>
			(function () {
				try {
					var t;
					try {
						t = localStorage.getItem('theme');
					} catch (e) {}
					if (t !== 'light' && t !== 'dark') {
						t = 'dark';
					}
					document.documentElement.setAttribute('data-theme', t);
					document.documentElement.style.colorScheme = t;
					document
						.querySelector('meta[name="theme-color"]')
						.setAttribute('content', t === 'dark' ? '#0a0f1a' : '#eceff3');
				} catch (e) {}
			})();
		</script>

		<script>
			// Selepas deploy baharu, HTML lama dalam cache boleh merujuk fail JS yang sudah dibuang: muat semula sekali.
			addEventListener('unhandledrejection', function (e) {
				var m = String((e.reason && e.reason.message) || e.reason);
				if (!/dynamically imported module|Importing a module script failed/.test(m)) return;
				try {
					if (sessionStorage.getItem('chunk-reload')) return;
					sessionStorage.setItem('chunk-reload', '1');
				} catch (_) {
					return;
				}
				location.reload();
			});
		</script>
